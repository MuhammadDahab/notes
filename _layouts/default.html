<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#677084; --line:#e3e6ec;
  --accent:#2f6fde; --accent-soft:#e8f0fd; --code-bg:#f1f3f6; --code-text:#1d2330;
  --mark:#ffe58a; --side-w:290px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151b; --panel:#1a1e26; --text:#e4e7ee; --muted:#9099ab; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1f2a3f; --code-bg:#0f1218; --code-text:#e4e7ee;
    --mark:#7a6420;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:16px}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; font-size:16px; line-height:1.8}

/* ===== التخطيط ===== */
.layout{display:flex; min-height:100vh}
.side{width:var(--side-w); flex-shrink:0; background:var(--panel); border-inline-start:0;
  border-inline-end:1px solid var(--line); position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column}
.side-head{padding:20px 18px 12px; border-bottom:1px solid var(--line)}
.brand{font-weight:700; font-size:20px; margin:0 0 12px}
.search{position:relative}
.search input{width:100%; padding:10px 38px 10px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--bg); color:var(--text); font:inherit; font-size:15px; outline:none}
.search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.count{font-size:13px; color:var(--muted); margin-top:8px}
.toc{overflow-y:auto; padding:10px 10px 30px; flex:1}
.toc-group{margin-bottom:6px}
.toc-group-btn{width:100%; display:flex; align-items:center; gap:8px; border:0; background:none;
  color:var(--muted); font:inherit; font-size:13px; font-weight:600; letter-spacing:.3px;
  padding:8px 8px; cursor:pointer; border-radius:8px; text-align:start}
.toc-group-btn:hover{background:var(--bg)}
.toc-group-btn .chev{transition:transform .2s; flex-shrink:0}
.toc-group.closed .chev{transform:rotate(90deg)}
.toc-group.closed ul{display:none}
.toc-group-btn .n{margin-inline-start:auto; font-weight:500; font-size:12px; background:var(--bg);
  padding:0 8px; border-radius:20px}
.toc ul{list-style:none; margin:0; padding:0}
.toc a{display:block; padding:7px 12px; margin:1px 0; border-radius:8px; color:var(--text);
  text-decoration:none; font-size:14.5px; line-height:1.5; border-inline-start:3px solid transparent}
.toc a:hover{background:var(--bg)}
.toc a.active{background:var(--accent-soft); color:var(--accent); border-inline-start-color:var(--accent); font-weight:600}

.main{flex:1; min-width:0; padding:32px 40px 80px}
.wrap{max-width:820px; margin:0 auto}
.page-title{font-size:28px; margin:0 0 6px}
.page-sub{color:var(--muted); margin:0 0 28px; font-size:15px}

/* ===== الملاحظات ===== */
.group-title{font-size:15px; color:var(--muted); font-weight:600; margin:36px 0 12px;
  display:flex; align-items:center; gap:10px}
.group-title::after{content:""; flex:1; height:1px; background:var(--line)}
.note{background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:6px 22px 14px; margin-bottom:14px; transition:box-shadow .2s, border-color .2s}
.note.flash{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.note h3{font-size:18px; margin:12px 0 6px; line-height:1.6}
.note h3 a.anchor{color:var(--muted); text-decoration:none; opacity:0; margin-inline-start:6px; font-weight:400}
.note h3:hover a.anchor{opacity:1}
.note h4{font-size:15.5px; margin:16px 0 4px}
.note p{margin:8px 0}
.note ul,.note ol{padding-inline-start:22px; margin:8px 0}
.hidden{display:none !important}
mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 2px}
.empty{text-align:center; color:var(--muted); padding:60px 0}

/* الكود: دايمًا من الشمال لليمين */
code{font-family:"JetBrains Mono",monospace; font-size:.86em; background:var(--code-bg);
  padding:2px 6px; border-radius:6px; direction:ltr; unicode-bidi:isolate}
pre{position:relative; direction:ltr; text-align:left; background:var(--code-bg); color:var(--code-text);
  border:1px solid var(--line); border-radius:10px; padding:14px 64px 14px 16px; overflow-x:auto; margin:10px 0;
  line-height:1.6}
pre code{background:none; padding:0; font-size:13.5px; white-space:pre}
.highlight{background:none !important}
.copy{position:absolute; top:8px; right:8px; border:1px solid var(--line); background:var(--panel);
  color:var(--muted); font:inherit; font-size:12px; padding:2px 10px; border-radius:6px; cursor:pointer;
  font-family:"IBM Plex Sans Arabic",sans-serif; opacity:.85}
.copy:hover{color:var(--accent); border-color:var(--accent); opacity:1}

/* ===== الموبايل ===== */
.topbar{display:none}
.scrim{display:none}
@media (max-width: 860px){
  .topbar{display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:20;
    background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px}
  .topbar button{border:1px solid var(--line); background:var(--bg); color:var(--text);
    border-radius:8px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer}
  .topbar .brand{margin:0; font-size:17px}
  .side{position:fixed; top:0; right:0; z-index:40; height:100vh; width:min(86vw,320px);
    transform:translateX(100%); transition:transform .25s; box-shadow:0 0 30px rgba(0,0,0,.2)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30}
  .main{padding:20px 16px 60px}
  .page-title{font-size:23px}
  .note{padding:4px 16px 12px}
  html{scroll-padding-top:64px}
}
</style>
</head>
<body>
<div class="topbar">
  <button id="menuBtn" type="button" aria-label="الفهرس">☰ الفهرس</button>
  <p class="brand">{{ page.title | default: site.title }}</p>
</div>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="side" id="side">
    <div class="side-head">
      <p class="brand">{{ page.title | default: site.title }}</p>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ابحث في الملاحظات…  ( / )" autocomplete="off">
      </div>
      <div class="count" id="count"></div>
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>
  <main class="main">
    <div class="wrap" id="content">
{{ content }}
    </div>
  </main>
</div>
<script>
(function(){
  var content = document.getElementById('content');
  var toc = document.getElementById('toc');
  var q = document.getElementById('q');
  var count = document.getElementById('count');

  // 1) عنوان الصفحة الرئيسي (#) يبقى عنوان فوق
  var h1 = content.querySelector('h1');
  if (h1) h1.classList.add('page-title');

  // 2) نجمّع: كل ## = مجموعة، وكل ### = ملاحظة (كارت)
  var nodes = Array.prototype.slice.call(content.children);
  var groups = [], curGroup = null, curNote = null, used = {};
  function slug(t){
    var s = t.trim().replace(/[\s ]+/g,'-').replace(/[^\p{L}\p{N}\-]/gu,'').slice(0,60) || 'note';
    var base = s, i = 2; while (used[s]) s = base + '-' + (i++); used[s] = 1; return s;
  }
  nodes.forEach(function(el){
    var tag = el.tagName;
    if (tag === 'H1') { curNote = null; return; }
    if (tag === 'H2') {
      el.className = 'group-title';
      curGroup = { title: el.textContent.trim(), el: el, notes: [] };
      groups.push(curGroup); curNote = null; return;
    }
    if (tag === 'H3') {
      if (!curGroup) { curGroup = { title: 'عام', el: null, notes: [] }; groups.push(curGroup); }
      var art = document.createElement('article');
      art.className = 'note';
      var title = el.textContent.trim();
      art.id = slug(title);
      el.parentNode.insertBefore(art, el);
      art.appendChild(el);
      var a = document.createElement('a'); a.className = 'anchor'; a.href = '#' + art.id; a.textContent = '#';
      el.appendChild(a);
      curNote = { title: title, el: art, group: curGroup };
      curGroup.notes.push(curNote); return;
    }
    if (curNote) curNote.el.appendChild(el);
  });

  // 3) نبني الفهرس الجانبي
  var allNotes = [];
  groups.forEach(function(g){
    if (!g.notes.length) return;
    var box = document.createElement('div'); box.className = 'toc-group';
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'toc-group-btn';
    btn.innerHTML = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>';
    var label = document.createElement('span'); label.textContent = g.title; btn.appendChild(label);
    var n = document.createElement('span'); n.className = 'n'; btn.appendChild(n);
    btn.onclick = function(){ box.classList.toggle('closed'); };
    var ul = document.createElement('ul');
    g.notes.forEach(function(nt){
      var li = document.createElement('li');
      var a = document.createElement('a'); a.href = '#' + nt.el.id; a.textContent = nt.title;
      a.onclick = function(){ document.body.classList.remove('menu-open'); flash(nt.el); };
      li.appendChild(a); ul.appendChild(li);
      nt.link = a; nt.li = li; nt.text = (g.title + ' ' + nt.el.textContent).toLowerCase();
      allNotes.push(nt);
    });
    g.box = box; g.count = n;
    box.appendChild(btn); box.appendChild(ul); toc.appendChild(box);
  });

  var empty = document.createElement('div'); empty.className = 'empty hidden';
  empty.textContent = 'مفيش ملاحظات فيها الكلمة دي';
  content.appendChild(empty);

  function flash(el){ el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 1200); }

  // 4) زرار "نسخ" على كل كود
  content.querySelectorAll('pre').forEach(function(pre){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'نسخ';
    b.onclick = function(){
      var txt = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
      navigator.clipboard.writeText(txt.replace(/\n$/,'')).then(function(){
        b.textContent = 'اتنسخ ✓'; setTimeout(function(){ b.textContent = 'نسخ'; }, 1500);
      });
    };
    pre.appendChild(b);
  });

  // 5) البحث
  function clearMarks(root){
    root.querySelectorAll('mark[data-hl]').forEach(function(m){
      var t = document.createTextNode(m.textContent); m.parentNode.replaceChild(t, m); t.parentNode.normalize();
    });
  }
  function highlight(root, term){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){ return n.parentNode.closest('button,.anchor') ? 2 : 1; }
    });
    var list = [], n; while ((n = walker.nextNode())) list.push(n);
    list.forEach(function(node){
      var lower = node.nodeValue.toLowerCase(), idx = lower.indexOf(term);
      if (idx < 0) return;
      var frag = document.createDocumentFragment(), last = 0, v = node.nodeValue;
      while (idx >= 0){
        frag.appendChild(document.createTextNode(v.slice(last, idx)));
        var m = document.createElement('mark'); m.setAttribute('data-hl',''); m.textContent = v.slice(idx, idx + term.length);
        frag.appendChild(m); last = idx + term.length; idx = lower.indexOf(term, last);
      }
      frag.appendChild(document.createTextNode(v.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }
  function run(){
    var term = q.value.trim().toLowerCase(), shown = 0;
    clearMarks(content);
    allNotes.forEach(function(nt){
      var ok = !term || nt.text.indexOf(term) >= 0;
      nt.el.classList.toggle('hidden', !ok); nt.li.classList.toggle('hidden', !ok);
      if (ok) { shown++; if (term) highlight(nt.el, term); }
    });
    groups.forEach(function(g){
      if (!g.box) return;
      var vis = g.notes.filter(function(nt){ return !nt.el.classList.contains('hidden'); }).length;
      g.box.classList.toggle('hidden', vis === 0);
      if (g.el) g.el.classList.toggle('hidden', vis === 0);
      g.count.textContent = vis;
      if (term) g.box.classList.remove('closed');
    });
    count.textContent = term ? (shown + ' من ' + allNotes.length + ' ملاحظة') : (allNotes.length + ' ملاحظة');
    empty.classList.toggle('hidden', shown > 0);
  }
  q.addEventListener('input', run);
  q.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { q.value = ''; run(); }
    if (e.key === 'Enter') {
      var first = allNotes.filter(function(nt){ return !nt.el.classList.contains('hidden'); })[0];
      if (first) { document.body.classList.remove('menu-open'); first.el.scrollIntoView(); flash(first.el); }
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  run();

  // 6) تمييز الملاحظة اللي انت واقف عندها في الفهرس
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (!en.isIntersecting) return;
        allNotes.forEach(function(nt){ nt.link.classList.toggle('active', nt.el === en.target); });
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    allNotes.forEach(function(nt){ io.observe(nt.el); });
  }

  // 7) الموبايل: زرار الفهرس
  document.getElementById('menuBtn').onclick = function(){ document.body.classList.toggle('menu-open'); };
  document.getElementById('scrim').onclick = function(){ document.body.classList.remove('menu-open'); };
})();
</script>
</body>
</html>
